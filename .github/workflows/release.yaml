name: Release

on:
  workflow_call:
    inputs:
      go-mod-private:
        type: string
        default: ""
      go-mod-private-owner:
        type: string
        default: ""
    secrets:
      GO_MOD_APP_ID:
        required: false
      GO_MOD_APP_PRIVATE_KEY:
        required: false

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.go-semver.outputs.NEW_RELEASE }}
      semver: ${{ steps.go-semver.outputs.SEMVER }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: check if .semver.yaml exists
        run: |
          if [ ! -f ".semver.yaml" ]; then
            echo ".semver.yaml not found. Please create one in the root of the repository."
            exit 1
          fi

      - name: Install Go Semver Release
        run: |
          curl -SL https://github.com/s0ders/go-semver-release/releases/latest/download/go-semver-release-linux-amd64 -o ./go-semver-release \
          && chmod +x ./go-semver-release

      - name: Go Semver Release
        id: go-semver
        run: |
          OUTPUT=$(./go-semver-release release . --dry-run)
          echo "$OUTPUT"
          NEW_RELEASE=$(echo "$OUTPUT" | jq -r '.releases[0].new_release')
          VERSION=$(echo "$OUTPUT" | jq -r '.releases[0].version')
          echo "NEW_RELEASE=$NEW_RELEASE" >> "$GITHUB_OUTPUT"
          echo "SEMVER=v$VERSION" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    needs: versioning
    if: ${{ needs.versioning.outputs.release == 'true' }}
    permissions:
      contents: write
    env:
      GOMODPRIVATE: ${{ inputs.go-mod-private }}
      GONOSUMCHECK: ${{ inputs.go-mod-private }}
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub App token for private Go modules
        if: inputs.go-mod-private != ''
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GO_MOD_APP_ID }}
          private-key: ${{ secrets.GO_MOD_APP_PRIVATE_KEY }}
          owner: ${{ inputs.go-mod-private-owner }}

      - name: Configure git auth for private Go modules
        if: inputs.go-mod-private != ''
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sync cross-module versions
        run: |
          SEMVER="${{ needs.versioning.outputs.semver }}"
          ROOT_MODULE=$(go mod edit -json | jq -r '.Module.Path')

          # For each submodule, update any require that references a sibling module
          find . -mindepth 2 -name 'go.mod' -not -path '*/vendor/*' | while read -r modfile; do
            dir=$(dirname "$modfile")
            # Find requires sharing the root module path (siblings in this repo)
            deps=$(cd "$dir" && go mod edit -json | jq -r --arg root "$ROOT_MODULE" \
              '.Require[]? | select(.Path == $root or (.Path | startswith($root + "/"))) | .Path')
            for dep in $deps; do
              echo "Updating $modfile: $dep@$SEMVER"
              (cd "$dir" && go mod edit -require "${dep}@${SEMVER}")
            done
          done

      - name: Commit version sync
        run: |
          if git diff --quiet; then
            echo "No cross-module version changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A '*/go.mod'
            git commit -m "chore: sync cross-module versions to ${{ needs.versioning.outputs.semver }}"
          fi

      - name: Create and push tags
        run: |
          SEMVER="${{ needs.versioning.outputs.semver }}"

          # Root tag
          git tag "$SEMVER"

          # Submodule tags for Go multi-module repos
          find . -mindepth 2 -name 'go.mod' -not -path '*/vendor/*' | while read -r modfile; do
            dir=$(dirname "$modfile" | sed 's|^\./||')
            tag="${dir}/${SEMVER}"
            echo "Tagging submodule: $tag"
            git tag "$tag"
          done

          git push origin HEAD --tags

      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.versioning.outputs.semver }}" \
            --generate-notes \
            --title "${{ needs.versioning.outputs.semver }}"
